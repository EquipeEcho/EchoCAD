services:
  frontend:
    image: echocad_fronted:dev_v1
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FRONTEND_INTERNAL_PORT: ${FRONTEND_INTERNAL_PORT:-81}
    container_name: echocad_frontend
    networks:
      - echocad_network
    ports:
      - "${FRONTEND_PORT:-80}:${FRONTEND_INTERNAL_PORT:-81}"
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: echocad_cloudflared
    restart: unless-stopped
    depends_on:
      - frontend
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN} --url http://frontend:${FRONTEND_INTERNAL_PORT:-81}
    networks:
      - echocad_network

networks:
  echocad_network:
    driver: bridge