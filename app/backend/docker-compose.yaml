services:
  mariadb:
    image: mariadb:11.4
    container_name: echocad_dbms
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-default_password}"
      MYSQL_USER: "${MYSQL_USER:-user}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-echocad_password}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-echocad_db}"
      MYSQL_INITDB_SKIP_TZINFO: "${MYSQL_INITDB_SKIP_TZINFO:-yes}"
    networks:
      - echocad_network
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "${MYSQL_USER:-user}", "-p${MYSQL_PASSWORD:-echocad_password}" ]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  backend:
    image: echocad_server:dev_v1
    build:
      dockerfile: Dockerfile
    container_name: echocad_server
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_ASYNC_URL: ${DATABASE_ASYNC_URL}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_TOKEN: ${JWT_TOKEN:-super_secret_jwt_key_change_me}
      ECHO_DATABASE: ${ECHO_DATABASE:-true}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    networks:
      - echocad_network
    ports:
      - 8000:8000
    depends_on:
      mariadb:
        condition: service_healthy

volumes:
  mariadb_data:

networks:
  echocad_network:
    driver: bridge
