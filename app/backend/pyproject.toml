[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agno>=2.5.17",
    "alembic>=1.18.4",
    "bcrypt>=5.0.0",
    "cryptography>=47.0.0",
    "deprecated>=1.3.1",
    "ezdxf>=1.4.3",
    "fastapi[standard]>=0.136.0",
    "loguru>=0.7.3",
    "networkx>=3.4.2",
    "ollama>=0.6.1",
    "openai>=2.32.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pymysql>=1.1.2",
    "sqlalchemy>=2.0.49",
    "pyjwt>=2.8.0",
    "python-docx>=1.1.2",
    "requests>=2.34.2",
    "aiomysql>=0.3.2",
    "python-multipart>=0.0.29",
    "aiofiles>=25.1.0",
]

[dependency-groups]
dev = [
    "groq>=1.2.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
